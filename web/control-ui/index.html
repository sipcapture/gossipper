<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gossipper — Control</title>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('gossipper_control_theme')
          if (t === 'light') {
            document.documentElement.classList.remove('dark')
            return
          }
          if (t === 'dark') {
            document.documentElement.classList.add('dark')
            return
          }
          var leg = localStorage.getItem('gossipper_control_dark')
          if (leg === '0') {
            document.documentElement.classList.remove('dark')
            return
          }
          document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
