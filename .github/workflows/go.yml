name: Go Builder

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [self-hosted, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use isolated Go cache paths
        run: |
          GO_MOD_CACHE=$(mktemp -d "${RUNNER_TEMP}/gomodcache.XXXXXX")
          GO_BUILD_CACHE=$(mktemp -d "${RUNNER_TEMP}/gocache.XXXXXX")
          echo "GOMODCACHE=$GO_MOD_CACHE" >> "$GITHUB_ENV"
          echo "GOCACHE=$GO_BUILD_CACHE" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.1"
          cache: false

      - name: Test
        run: go test ./...

      - name: Build
        run: make build
