name: Go Builder

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use isolated Go cache paths
        run: |
          GO_MOD_CACHE=$(mktemp -d "${RUNNER_TEMP}/gomodcache.XXXXXX")
          GO_BUILD_CACHE=$(mktemp -d "${RUNNER_TEMP}/gocache.XXXXXX")
          echo "GOMODCACHE=$GO_MOD_CACHE" >> "$GITHUB_ENV"
          echo "GOCACHE=$GO_BUILD_CACHE" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.1"
          cache: false

      - name: Set up Node (Control UI for embed + packages)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/control-ui/package-lock.json

      - name: Test and build
        run: |
          make frontend
          (cd web/control-ui && npm test)
          go test ./...
          go test -race -short \
            ./internal/api/... \
            ./internal/api/v2/... \
            ./internal/settingsauth/... \
            ./internal/pcap2scenario/... \
            ./internal/loadtest/... \
            ./internal/supervisor/... \
            ./internal/uistore/...
          make build-go
          make smoke
          make smoke-webrtc
