name: Go Builder

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [self-hosted, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.1"

      - name: Test
        run: go test ./...

      - name: Build
        run: make build
