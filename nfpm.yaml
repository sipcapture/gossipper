name: "gossipper"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "net"
priority: "optional"
maintainer: "QXIP <support@qxip.net>"
description: |
  Gossipper is a Go-based SIP traffic generator and SIPp-compatible
  scenario runner with incremental XML parity, 3PCC helpers, and RTP tooling.
  (AGPL-3.0)
vendor: "QXIP"
homepage: "https://github.com/sipcapture/gossipper"
# license omitted: nfpm writes "License:" into deb control; Packagecloud may 500.

contents:
  - src: ./dist/gossipper
    dst: /usr/bin/gossipper
    file_info:
      mode: 0755

  - src: ./README.md
    dst: /usr/share/doc/gossipper/README.md
    file_info:
      mode: 0644

  - src: ./LICENSE
    dst: /usr/share/doc/gossipper/LICENSE
    file_info:
      mode: 0644

  - src: ./docs
    dst: /usr/share/doc/gossipper/docs

  - src: ./internal/api/webdist
    dst: /usr/share/gossipper/control-ui
    type: tree

  - dst: /etc/gossipper
    type: dir
    file_info:
      mode: 0755
