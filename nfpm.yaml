name: "gossipper"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "net"
priority: "optional"
maintainer: "QXIP <support@qxip.net>"
description: |
  Gossipper is a Go-based SIP traffic generator and SIPp-compatible
  scenario runner with incremental XML parity, 3PCC helpers, and RTP tooling.
  (AGPL-3.0)
  Install layout under /usr/local/gossipper: bin, etc (sample JSON + doc), data (persistent state, e.g. internal-auth SQLite), logs, dist (Control UI static files).
  Ships systemd units gossipper-server.service, gossipper-client.service, gossipper-hybrid.service plus sample JSON under /usr/local/gossipper/etc/ (management composite, flat UAC, hybrid server+clients).
vendor: "QXIP"
homepage: "https://github.com/sipcapture/gossipper"
# license omitted: nfpm writes "License:" into deb control; Packagecloud may 500.

contents:
  - src: ./dist/gossipper
    dst: /usr/local/gossipper/bin/gossipper
    file_info:
      mode: 0755

  - src: /usr/local/gossipper/bin/gossipper
    dst: /usr/local/bin/gossipper
    type: symlink

  - src: ./README.md
    dst: /usr/local/gossipper/etc/doc/README.md
    file_info:
      mode: 0644

  - src: ./LICENSE
    dst: /usr/local/gossipper/etc/doc/LICENSE
    file_info:
      mode: 0644

  - src: ./docs
    dst: /usr/local/gossipper/etc/doc/docs
    type: tree

  - src: ./internal/api/webdist
    dst: /usr/local/gossipper/dist
    type: tree

  - dst: /usr/local/gossipper/logs
    type: dir
    file_info:
      mode: 0755

  - dst: /usr/local/gossipper/data
    type: dir
    file_info:
      mode: 0755

  - src: ./examples/gossipper-hybrid.service
    dst: /lib/systemd/system/gossipper-hybrid.service
    file_info:
      mode: 0644

  - src: ./examples/gossipper-hybrid.json
    dst: /usr/local/gossipper/etc/gossipper-hybrid.json
    file_info:
      mode: 0644

  - src: ./examples/gossipper-server.service
    dst: /lib/systemd/system/gossipper-server.service
    file_info:
      mode: 0644

  - src: ./examples/gossipper-client.service
    dst: /lib/systemd/system/gossipper-client.service
    file_info:
      mode: 0644

  - src: ./examples/gossipper-management.json
    dst: /usr/local/gossipper/etc/gossipper-server.json
    file_info:
      mode: 0644

  - src: ./examples/gossipper-uac.json
    dst: /usr/local/gossipper/etc/gossipper-client.json
    file_info:
      mode: 0644

  - src: ./examples/gossipper-management-auth.sample.json
    dst: /usr/local/gossipper/etc/gossipper-management-auth.sample.json
    file_info:
      mode: 0644

scripts:
  postinstall: scripts/nfpm-postinstall.sh
