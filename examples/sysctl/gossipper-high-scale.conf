# Persistent sysctl snippet for gossipper high-scale cleartext RTP (10k+ streams).
# Install: sudo cp gossipper-high-scale.conf /etc/sysctl.d/99-gossipper.conf && sudo sysctl --system
#
# Also set: ulimit -n 1048576 (systemd LimitNOFILE=1048576 for gossipper.service)

net.core.rmem_max = 33554432
net.core.rmem_default = 8388608
net.core.wmem_max = 33554432
net.core.wmem_default = 4194304
net.core.netdev_max_backlog = 250000

net.ipv4.udp_mem = 262144 524288 1048576
net.ipv4.ip_local_port_range = 1024 65535

fs.file-max = 2097152
